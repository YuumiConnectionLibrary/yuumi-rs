[package]
name = "yuumi"
version = "0.1.0"
edition = "2021"
description = "Rust engine SDK for the Yuumi IPC protocol"
license = "MIT"
repository = "https://github.com/YuumiConnectionLibrary/yuumi-rs"
keywords = ["ipc", "named-pipe", "protocol", "yuumi"]
categories = ["network-programming"]
exclude = ["tests/**"]

[package.metadata.yuumi]
role = "engine"
platform_support = "linux/macos: Unix domain socket; windows: Named Pipe"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
